<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housekeeping Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@microsoft/teams-js@2/dist/MicrosoftTeams.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EFF4F1; --panel:#FFFFFF; --ink:#1D2A26; --ink-soft:#5B6B65; --line:#DCE6E1;
    --teal:#1F6F63; --teal-dark:#164F46; --teal-tint:#E3F0EC;
    --amber:#C98A2C; --amber-tint:#FBEEDA; --red:#B9503F; --red-tint:#F8E5E1;
    --radius-card:14px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
  .app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
  header.top{padding:22px 20px 16px; border-bottom:1px solid var(--line); background:var(--panel);}
  header.top h1{font-family:'Noto Serif Thai',serif; font-size:22px; font-weight:700; margin:0 0 2px; color:var(--teal-dark);}
  header.top p{margin:0; font-size:13px; color:var(--ink-soft);}
  .conn{display:inline-flex; align-items:center; gap:5px; font-size:11px; margin-top:8px; color:var(--ink-soft);}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .conn.off .dot{background:var(--red);}
  nav.tabs{display:flex; gap:6px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  nav.tabs button{flex:0 0 auto; min-width:74px; border:none; background:transparent; padding:9px 8px; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--ink-soft); border-radius:10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; white-space:nowrap;}
  nav.tabs button .count{font-size:10.5px; font-weight:600; color:var(--teal);}
  nav.tabs button.active{background:var(--teal-tint); color:var(--teal-dark);}
  main{flex:1; padding:16px 16px 90px;}
  .group-title{font-size:15px; font-weight:700; margin:22px 0 4px; color:var(--teal-dark); display:flex; align-items:baseline; gap:8px;}
  .group-title:first-child{margin-top:4px;}
  .group-sub{font-size:12px; color:var(--ink-soft); font-weight:500; margin-bottom:10px;}
  .subcat{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:14px 0 6px 2px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:12px 14px; margin-bottom:8px;}
  .item-row{display:flex; align-items:center; gap:10px;}
  .item-info{flex:1; min-width:0;}
  .item-name{font-size:14.5px; font-weight:600; color:var(--ink);}
  .item-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--radius-pill); margin-top:5px;}
  .badge.ok{background:var(--teal-tint); color:var(--teal-dark);}
  .badge.low{background:var(--amber-tint); color:var(--amber);}
  .badge.out{background:var(--red-tint); color:var(--red);}
  .stepper{display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:var(--radius-pill); padding:4px;}
  .stepper button{width:28px;height:28px; border-radius:50%; border:none; background:var(--panel); color:var(--teal-dark); font-size:16px; font-weight:700; cursor:pointer; display:flex;align-items:center;justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .stepper .qty{min-width:26px; text-align:center; font-weight:700; font-size:14px;}
  .add-order-btn{margin-top:8px; width:100%; border:1px solid var(--teal); background:var(--teal-tint); color:var(--teal-dark); font-family:inherit; font-size:12.5px; font-weight:600; padding:7px; border-radius:9px; cursor:pointer;}
  .add-order-btn.added{background:var(--teal); color:#fff; border-color:var(--teal);}
  .usage-row{display:flex; gap:6px; margin-top:6px; align-items:center;}
  .usage-row input{width:60px; padding:7px 6px; font-size:12.5px;}
  .usage-btn{flex:1; border:1px solid var(--red); background:var(--red-tint); color:var(--red); font-family:inherit; font-size:12px; font-weight:600; padding:7px; border-radius:9px; cursor:pointer;}
  .fab{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; max-width:560px; width:calc(100% - 32px);}
  .fab button{width:100%; background:var(--teal-dark); color:#fff; border:none; padding:14px; border-radius:var(--radius-pill); font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(22,79,70,.28);}
  .empty{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 20px;}
  .queue-item{display:flex; align-items:center; gap:10px;}
  .queue-item .item-info{flex:1;}
  .remove-btn{border:none; background:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px 6px;}
  .add-form{background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius-card); padding:14px; margin-top:16px;}
  .add-form h3{margin:0 0 10px; font-size:14px; color:var(--teal-dark);}
  .field-row{display:flex; gap:8px; margin-bottom:8px;}
  .field-row.wide input, .field-row.wide select{flex:1;}
  input, select{font-family:inherit; font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); width:100%;}
  .toggle-add{text-align:center; color:var(--teal-dark); font-size:13px; font-weight:600; padding:10px; cursor:pointer; margin-top:8px;}
  .primary-btn{background:var(--teal); color:#fff; border:none; padding:10px 14px; border-radius:9px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; width:100%; margin-top:4px;}
  .primary-btn:disabled{opacity:.5; cursor:default;}
  .ghost-btn{background:none; border:1px solid var(--line); color:var(--ink-soft); padding:9px 14px; border-radius:9px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; width:100%;}
  .batch-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px; margin-bottom:14px;}
  .batch-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .batch-head .date{font-size:12px; color:var(--ink-soft);}
  .batch-status{font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); white-space:nowrap;}
  .batch-status.pending{background:var(--amber-tint); color:var(--amber);}
  .batch-status.done{background:var(--teal-tint); color:var(--teal-dark);}
  .batch-progress{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .purchase-line{padding:9px 0; border-bottom:1px solid var(--line);}
  .purchase-line:last-of-type{border-bottom:none;}
  .purchase-line-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;}
  .purchase-line .lname{font-size:13.5px; font-weight:600;}
  .purchase-line .lcat{font-size:11px; color:var(--ink-soft); font-weight:400;}
  .purchase-actions{display:flex; align-items:center; gap:6px;}
  .purchase-actions input{width:56px; text-align:center; padding:6px 4px; font-size:13px;}
  .toggle-btn{border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); font-family:inherit; font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;}
  .toggle-btn.done-active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .toggle-btn.fail-active{background:var(--red); color:#fff; border-color:var(--red);}
  .result-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill);}
  .result-tag.done{background:var(--teal-tint); color:var(--teal-dark);}
  .result-tag.failed{background:var(--red-tint); color:var(--red);}
  .batch-actions{display:flex; gap:8px; margin-top:12px;}
  .csv-btn{background:var(--panel); border:1px solid var(--teal); color:var(--teal-dark);}
  .count-line{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
  .count-line:last-of-type{border-bottom:none;}
  .count-line .lname{flex:1; font-size:13.5px; font-weight:600;}
  .count-line .sysqty{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .count-line input{width:66px; text-align:center;}
  .metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .metric-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px; text-align:center;}
  .metric-box .num{font-size:24px; font-weight:700; color:var(--teal-dark); font-family:'Noto Serif Thai',serif;}
  .metric-box.warn .num{color:var(--red);}
  .metric-box .lbl{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .range-row{display:flex; gap:8px; margin-bottom:10px; align-items:center;}
  .range-row input{flex:1;}
  .range-row span{font-size:12px; color:var(--ink-soft);}
  .agg-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .agg-line:last-of-type{border-bottom:none;}
  .agg-line .n{font-weight:600;}
  .copy-toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--teal-dark); color:#fff; padding:9px 16px; border-radius:var(--radius-pill); font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; text-align:center; z-index:50;}
  .copy-toast.show{opacity:1;}
  .loading, .fatal{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .setup{padding:32px 22px; max-width:440px; margin:40px auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card);}
  .setup h2{font-family:'Noto Serif Thai',serif; color:var(--teal-dark); font-size:19px; margin:0 0 10px;}
  .setup p{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 14px;}
  .setup input{margin-bottom:10px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">กำลังโหลด…</div>
</div>

<script>
/* ====== เริ่ม Teams SDK ถ้าเปิดอยู่ใน Microsoft Teams (ไม่มีผลถ้าเปิดในเบราว์เซอร์ปกติ) ====== */
if (window.microsoftTeams) {
  try{
    microsoftTeams.app.initialize().then(()=>{
      microsoftTeams.app.notifySuccess();
    }).catch(()=>{});
  }catch(e){}
}

/* ====== ตั้งค่าการเชื่อมต่อ Google Sheet (Apps Script Web App URL) ====== */
let API_URL = localStorage.getItem('sheetApiUrl') || '';

let items = [];
let queue = [];
let batches = [];
let stockChecks = [];
let usageLog = [];

let draftRequesterName = localStorage.getItem('lastRequesterName') || '';
let draftCheckerName = localStorage.getItem('lastCheckerName') || '';
let draftCheckerNote = '';
let draftNewItem = {name:'', group:'consumable', subcat:'', unit:'', qty:'', minQty:''};
let draftCounts = {};
let draftUsage = {};
let adjustStockOnSave = true;

function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function firstOfMonthStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-01'; }
let draftRangeStart = firstOfMonthStr();
let draftRangeEnd = todayStr();

window.__setNewItemDraft = function(field, val){ draftNewItem[field] = val; };
window.__setDraft = function(key, val){
  if(key==='requesterName') draftRequesterName = val;
  else if(key==='checkerName') draftCheckerName = val;
  else if(key==='checkerNote') draftCheckerNote = val;
};
window.__setCountDraft = function(itemId, val){ draftCounts[itemId] = val; };
window.__setUsageDraft = function(itemId, val){ draftUsage[itemId] = val; };
window.__toggleAdjustStock = function(checked){ adjustStockOnSave = checked; };
window.__setRange = function(which, val){ if(which==='start') draftRangeStart=val; else draftRangeEnd=val; render(); };

let activeTab = 'stock';
let showAddForm = false;
let connected = false;
let pollTimer = null;

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function api(action, payload){
  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=' + encodeURIComponent(action);
  const opts = payload
    ? { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }
    : { method:'GET' };
  const res = await fetch(url, opts);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function loadAll(){
  try{
    const data = await api('getAll');
    items = data.items || [];
    queue = data.queue || [];
    batches = data.batches || [];
    stockChecks = data.stockChecks || [];
    usageLog = data.usageLog || [];
    connected = true;
  }catch(e){
    connected = false;
  }
  render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadAll, 8000);
}

/* ====== setup screen ====== */
function renderSetup(){
  document.getElementById('app').innerHTML = `
    <div class="setup">
      <h2>เชื่อมต่อกับ Google Sheet</h2>
      <p>วาง URL ของ Web App ที่ deploy จาก Google Apps Script ระบบจะจำไว้ในเครื่องนี้ ไม่ต้องกรอกซ้ำ</p>
      <input id="url-input" placeholder="https://script.google.com/macros/s/.../exec" value="${API_URL}">
      <button class="primary-btn" onclick="window.__saveUrl()">เชื่อมต่อ</button>
    </div>`;
}
window.__saveUrl = async function(){
  const v = document.getElementById('url-input').value.trim();
  if(!v){ showToast('กรุณาวาง URL'); return; }
  API_URL = v;
  localStorage.setItem('sheetApiUrl', v);
  document.getElementById('app').innerHTML = '<div class="loading">กำลังเชื่อมต่อ…</div>';
  await loadAll();
  if(connected){ startPolling(); }
  else { showToast('เชื่อมต่อไม่สำเร็จ ตรวจสอบ URL อีกครั้ง'); renderSetup(); }
};

/* ====== data helpers ====== */
function statusOf(item){
  if(item.qty <= 0) return 'out';
  if(item.qty <= item.minQty) return 'low';
  return 'ok';
}
function statusLabel(s){ return s==='out' ? 'ของหมด' : s==='low' ? 'ใกล้หมด' : 'พอใช้'; }
function isQueued(id){ return queue.some(q=>q.itemId===id); }
function dateOnly(iso){ return iso ? String(iso).slice(0,10) : ''; }
function inRange(iso){ const d=dateOnly(iso); return d && d>=draftRangeStart && d<=draftRangeEnd; }

async function changeQty(id, delta){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  const newQty = Math.max(0, Number(it.qty) + delta);
  it.qty = newQty; render();
  try{ await api('updateItemQty', {id, qty:newQty}); }
  catch(e){ showToast('บันทึกไม่สำเร็จ'); }
  loadAll();
}

async function toggleQueue(id){
  const already = queue.find(q=>q.itemId===id);
  try{
    if(already){ await api('removeFromQueue', {itemId:id}); }
    else{
      const it = items.find(x=>x.id===id);
      const suggested = it ? Math.max(1, it.minQty - it.qty + 1) : 1;
      await api('addToQueue', {itemId:id, qty:suggested});
    }
    await loadAll();
  }catch(e){ showToast('บันทึกไม่สำเร็จ'); }
}

async function changeQueueQty(id, delta){
  const q = queue.find(x=>x.itemId===id);
  if(!q) return;
  const newQty = Math.max(1, Number(q.qty) + delta);
  try{ await api('updateQueueQty', {itemId:id, qty:newQty}); await loadAll(); }
  catch(e){ showToast('บันทึกไม่สำเร็จ'); }
}

async function removeFromQueue(id){
  try{ await api('removeFromQueue', {itemId:id}); await loadAll(); }
  catch(e){ showToast('ลบไม่สำเร็จ'); }
}

async function submitOrder(){
  if(queue.length===0) return;
  const requestedBy = draftRequesterName.trim();
  if(!requestedBy){ showToast('กรุณาใส่ชื่อผู้เบิกก่อนส่งรายการ'); return; }
  localStorage.setItem('lastRequesterName', requestedBy);
  const batchItems = queue.map(q=>{
    const it = items.find(x=>x.id===q.itemId);
    return {
      itemId:q.itemId, name: it?it.name:'ไม่ทราบชื่อ', unit: it?it.unit:'',
      category: it?it.subcat:'', group: it?it.group:'consumable',
      qty:q.qty, receivedQty:q.qty, purchaseStatus:'pending'
    };
  });
  try{
    await api('submitOrder', {items:batchItems, requestedBy});
    activeTab = 'summary';
    await loadAll();
    showToast('ส่งรายการสั่งซื้อแล้ว ดูได้ที่แท็บสรุป/จัดซื้อ');
  }catch(e){ showToast('ส่งรายการไม่สำเร็จ'); }
}

async function setPurchaseStatus(batchId, idx, status){
  const b = batches.find(x=>x.id===batchId);
  if(!b) return;
  const it = b.items[idx];
  const inputEl = document.getElementById('recv-'+batchId+'-'+idx);
  const receivedQty = inputEl ? (Number(inputEl.value)||0) : (it.receivedQty || it.qty);
  try{
    await api('updatePurchaseItem', {batchId, itemIndex: idx, purchaseStatus: status, receivedQty});
    await loadAll();
  }catch(e){ showToast('บันทึกไม่สำเร็จ'); }
}

async function deleteBatch(batchId){
  try{ await api('deleteBatch', {batchId}); await loadAll(); }
  catch(e){ showToast('ลบไม่สำเร็จ'); }
}

async function addNewItem(name, group, subcat, unit, qty, minQty){
  if(!name.trim()){ showToast('กรุณาใส่ชื่อสินค้า'); return; }
  try{
    await api('addItem', {name:name.trim(), group, subcat:subcat.trim()||'ทั่วไป', unit:unit.trim()||'ชิ้น', qty:Number(qty)||0, minQty:Number(minQty)||1});
    showAddForm = false;
    draftNewItem = {name:'', group:'consumable', subcat:'', unit:'', qty:'', minQty:''};
    await loadAll();
  }catch(e){ showToast('เพิ่มรายการไม่สำเร็จ'); }
}

async function logUsageItem(itemId){
  const val = Number(draftUsage[itemId]) || 0;
  if(val<=0){ showToast('กรุณาใส่จำนวนที่ใช้ไป'); return; }
  try{
    await api('logUsage', {itemId, qty:val, note:''});
    draftUsage[itemId] = '';
    await loadAll();
    showToast('บันทึกการใช้ของแล้ว');
  }catch(e){ showToast('บันทึกไม่สำเร็จ'); }
}

function setTab(t){
  activeTab = t;
  if(t==='weekly'){
    items.forEach(it=>{ if(draftCounts[it.id]===undefined) draftCounts[it.id] = String(it.qty); });
  }
  render();
}

function groupItems(list, group){
  const filtered = list.filter(i=>i.group===group);
  const bySub = {};
  filtered.forEach(i=>{ bySub[i.subcat] = bySub[i.subcat] || []; bySub[i.subcat].push(i); });
  return bySub;
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'}) + ' ' +
         d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
}

function copySummary(){
  const pending = batches.filter(b=>b.status==='pending');
  if(pending.length===0) return;
  let text = 'รายการสั่งซื้อของใช้ในบ้าน\n';
  pending.forEach(b=>{
    text += '\n— ส่งเมื่อ ' + fmtDate(b.createdAt) + (b.requestedBy ? ' · ผู้เบิก ' + b.requestedBy : '') + ' —\n';
    const byCat = {};
    b.items.forEach(it=>{ byCat[it.category] = byCat[it.category] || []; byCat[it.category].push(it); });
    Object.keys(byCat).forEach(cat=>{
      text += cat + ':\n';
      byCat[cat].forEach(it=>{ text += '  - ' + it.name + ' x ' + it.qty + ' ' + it.unit + '\n'; });
    });
  });
  navigator.clipboard.writeText(text).then(()=> showToast('คัดลอกรายการแล้ว')).catch(()=> showToast('คัดลอกไม่สำเร็จ'));
}

/* ====== Excel export (ใช้ร่วมกันทุกแท็บ) ====== */
function downloadWorkbook(sheets, filename){
  try{
    const wb = XLSX.utils.book_new();
    sheets.forEach(s=>{
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.rows), s.name);
    });
    XLSX.writeFile(wb, filename);
    showToast('ดาวน์โหลด Excel แล้ว');

function daysSince(iso){
  if(!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.floor(ms / 86400000);
}

async function logStockCheck(){
  const checkerName = draftCheckerName.trim();
  const note = draftCheckerNote.trim();
  if(!checkerName){ showToast('กรุณาใส่ชื่อผู้ตรวจนับก่อนบันทึก'); return; }
  localStorage.setItem('lastCheckerName', checkerName);

  const countItems = items.map(it=>{
    const actual = Number(draftCounts[it.id] !== undefined ? draftCounts[it.id] : it.qty) || 0;
    return { itemId: it.id, name: it.name, systemQty: it.qty, actualQty: actual, diff: actual - it.qty };
  });

  try{
    await api('addStockCheck', {checkerName, note, items: countItems, adjustStock: adjustStockOnSave});
    draftCheckerNote = '';
    draftCounts = {};
    await loadAll();
    showToast('บันทึกผลตรวจนับแล้ว');
  }catch(e){ showToast('บันทึกไม่สำเร็จ'); }
}

function renderBatchCard(b){
  const bitems = b.items || [];
  const doneCount = bitems.filter(it=> (it.purchaseStatus||'pending')==='done').length;
  const failedCount = bitems.filter(it=> (it.purchaseStatus||'pending')==='failed').length;

  let html = `<div class="batch-card">
    <div class="batch-head">
      <div>
        <div class="date">ส่งเมื่อ ${fmtDate(b.createdAt)}</div>
        ${b.requestedBy ? `<div class="date">ผู้เบิก: ${b.requestedBy}</div>` : ''}
        ${b.status==='done' ? `<div class="date">จัดซื้อเสร็จเมื่อ ${fmtDate(b.completedAt)}</div>` : ''}
      </div>
      <div class="batch-status ${b.status}">${b.status==='pending' ? 'กำลังจัดซื้อ' : 'เสร็จสิ้น'}</div>
    </div>`;

  if(b.status==='pending'){
    html += `<div class="batch-progress">สำเร็จ ${doneCount} · ไม่สำเร็จ ${failedCount} · เหลือ ${bitems.length-doneCount-failedCount} จากทั้งหมด ${bitems.length} รายการ</div>`;
  }

  bitems.forEach((it, idx)=>{
    const st = it.purchaseStatus || 'pending';
    const recv = it.receivedQty !== undefined ? it.receivedQty : it.qty;
    html += `<div class="purchase-line">
      <div class="purchase-line-top">
        <div class="lname">${it.name}<div class="lcat">${it.category} · ขอ ${it.qty} ${it.unit}</div></div>
        ${st!=='pending' ? `<span class="result-tag ${st}">${st==='done' ? '✓ ซื้อได้ '+recv+' '+it.unit : '✗ ไม่สำเร็จ'}</span>` : ''}
      </div>
      ${b.status==='pending' ? `
      <div class="purchase-actions">
        <input type="number" min="0" id="recv-${b.id}-${idx}" value="${recv}">
        <button class="toggle-btn ${st==='done'?'done-active':''}" onclick="window.__setPurchaseStatus('${b.id}',${idx},'done')">✓ สำเร็จ</button>
        <button class="toggle-btn ${st==='failed'?'fail-active':''}" onclick="window.__setPurchaseStatus('${b.id}',${idx},'failed')">✗ ไม่สำเร็จ</button>
      </div>` : ''}
    </div>`;
  });

  if(b.status==='pending'){
    html += `<div class="batch-actions"><button class="ghost-btn" onclick="window.__deleteBatch('${b.id}')">ลบรายการนี้ทั้งหมด</button></div>`;
  }
  html += `</div>`;
  return html;
}

  html += `<div class="metric-grid">
    <div class="metric-box ${lowStock.length>0?'warn':''}"><div class="num">${lowStock.length}</div><div class="lbl">ของใกล้หมด/หมด</div></div>
    <div class="metric-box"><div class="num">${queue.length}</div><div class="lbl">รอในรายการสั่งซื้อ</div></div>
    <div class="metric-box"><div class="num">${pendingBatches.length}</div><div class="lbl">คำสั่งซื้อกำลังดำเนินการ</div></div>
    <div class="metric-box"><div class="num">${doneAll}/${doneAll+failedAll}</div><div class="lbl">ซื้อสำเร็จทั้งหมด</div></div>
  </div>`;

  if(lowStock.length>0){
    html += `<div class="group-title" style="margin-top:18px">รายการที่ใกล้หมด/หมด</div><div class="card">`;
    lowStock.slice(0,8).forEach(it=>{
      html += `<div class="agg-line"><span>${it.name}</span><span class="n">${it.qty} ${it.unit}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="group-title" style="margin-top:22px">ดูข้อมูลย้อนหลัง</div>`;
  html += `<div class="card">
    <div class="range-row">
      <input type="date" value="${draftRangeStart}" onchange="window.__setRange('start', this.value)">
      <span>ถึง</span>
      <input type="date" value="${draftRangeEnd}" onchange="window.__setRange('end', this.value)">
    </div>
    <button class="primary-btn csv-btn" onclick="window.__exportRangeExcel()">⬇️ ดาวน์โหลด Excel ข้อมูลช่วงนี้</button>
  </div>`;

  const purchasedInRange = {};
  batches.filter(b=>inRange(b.createdAt)).forEach(b=>{
    b.items.filter(it=>it.purchaseStatus==='done').forEach(it=>{
      const key = it.name+'|'+it.unit;
      purchasedInRange[key] = (purchasedInRange[key]||0) + (Number(it.receivedQty!==undefined?it.receivedQty:it.qty)||0);
    });
  });
  html += `<div class="group-title" style="margin-top:16px">สั่งซื้อเข้าสต็อกในช่วงนี้</div><div class="card">`;
  const pKeys = Object.keys(purchasedInRange);
  if(pKeys.length===0){ html += `<div class="item-meta">ไม่มีข้อมูลในช่วงนี้</div>`; }
  else pKeys.forEach(k=>{ const [name,unit]=k.split('|'); html += `<div class="agg-line"><span>${name}</span><span class="n">+${purchasedInRange[k]} ${unit}</span></div>`; });
  html += `</div>`;

  const usedInRange = {};
  usageLog.filter(u=>inRange(u.date)).forEach(u=>{
    const key = u.name+'|'+u.unit;
    usedInRange[key] = (usedInRange[key]||0) + (Number(u.qty)||0);
  });
  html += `<div class="group-title" style="margin-top:16px">ใช้ไปในช่วงนี้</div><div class="card">`;
  const uKeys = Object.keys(usedInRange);
  if(uKeys.length===0){ html += `<div class="item-meta">ไม่มีข้อมูลในช่วงนี้ (บันทึกได้จากปุ่ม "บันทึกว่าใช้ไป" ในแท็บเช็คสต็อก)</div>`; }
  else uKeys.forEach(k=>{ const [name,unit]=k.split('|'); html += `<div class="agg-line"><span>${name}</span><span class="n">-${usedInRange[k]} ${unit}</span></div>`; });
  html += `</div>`;

  return html;
}

function render(){
  if(!API_URL){ renderSetup(); return; }
  const app = document.getElementById('app');
  const lowCount = items.filter(i=>statusOf(i)!=='ok').length;
  const pendingCount = batches.filter(b=>b.status==='pending').length;
  const lastCheck = stockChecks[0];
  const checkDays = lastCheck ? daysSince(lastCheck.date) : null;
  const checkOverdue = checkDays===null || checkDays>7;
  let body = '';
  if(activeTab==='stock') body = renderStockTab();
  else if(activeTab==='order') body = renderOrderTab();
  else if(activeTab==='weekly') body = renderWeeklyTab();
  else if(activeTab==='dashboard') body = renderDashboardTab();
  else body = renderSummaryTab();

  app.innerHTML = `
    <header class="top">
      <h1>Housekeeping Stock</h1>
      <p>เช็คสต็อก จัดหมวดหมู่ และส่งรายการสั่งซื้อได้ในที่เดียว</p>
      <div class="conn ${connected?'':'off'}"><span class="dot"></span>${connected ? 'เชื่อมต่อ Google Sheet แล้ว · sync ทุก 8 วิ' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต'}</div>
    </header>
    <nav class="tabs">
      <button class="${activeTab==='dashboard'?'active':''}" onclick="window.__setTab('dashboard')">แดชบอร์ด ${lowCount>0 ? `<span class="count">${lowCount} เตือน</span>` : ''}</button>
      <button class="${activeTab==='stock'?'active':''}" onclick="window.__setTab('stock')">เช็คสต็อก ${lowCount>0 ? `<span class="count">${lowCount} ใกล้หมด</span>` : ''}</button>
      <button class="${activeTab==='order'?'active':''}" onclick="window.__setTab('order')">สั่งซื้อ ${queue.length>0 ? `<span class="count">${queue.length}</span>` : ''}</button>
      <button class="${activeTab==='weekly'?'active':''}" onclick="window.__setTab('weekly')">ตรวจนับ ${checkOverdue ? `<span class="count">เกินกำหนด</span>` : ''}</button>
      <button class="${activeTab==='summary'?'active':''}" onclick="window.__setTab('summary')">สรุป/จัดซื้อ ${pendingCount>0 ? `<span class="count">${pendingCount}</span>` : ''}</button>
    </nav>
    <main>${body}</main>
    ${activeTab==='order' && queue.length>0 ? `<div class="fab"><button onclick="window.__submitOrder()">ส่งรายการให้ฝ่ายจัดซื้อ (${queue.length} รายการ)</button></div>` : ''}
    <div class="copy-toast" id="toast"></div>
  `;
}

window.__setTab = setTab;
window.__changeQty = changeQty;
window.__toggleQueue = toggleQueue;
window.__changeQueueQty = changeQueueQty;
window.__removeFromQueue = removeFromQueue;
window.__submitOrder = submitOrder;
window.__setPurchaseStatus = setPurchaseStatus;
window.__deleteBatch = deleteBatch;
window.__copySummary = copySummary;
window.__logStockCheck = logStockCheck;
window.__logUsage = logUsageItem;
window.__exportStockExcel = exportStockExcel;
window.__exportSummaryExcel = exportSummaryExcel;
window.__exportStockCheckExcel = exportStockCheckExcel;
window.__exportRangeExcel = exportRangeExcel;
window.__toggleAddForm = ()=>{ showAddForm = !showAddForm; render(); };
window.__submitAdd = ()=>{
  addNewItem(
    draftNewItem.name,
    draftNewItem.group,
    draftNewItem.subcat,
    draftNewItem.unit,
    draftNewItem.qty,
    draftNewItem.minQty
  );
};

if(API_URL){ loadAll().then(()=>{ if(connected) startPolling(); }); }
else{ renderSetup(); }
</script>
</body>
</html>
